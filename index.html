<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #001F3F;
      /* Dark blue background color */
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      /* Specify a fallback font */
      color: white;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      /* Adjust the gap between buttons as needed */
      margin-top: 20px;
      /* Add some top margin */
      position: relative;
    }

    .rounded-button {
      min-width: 200px;
      /* Adjust the width of the buttons as needed */
      padding: 10px;
      border: none;
      border-radius: 10px;
      background-color: #0074CC;
      /* Blue button color */
      color: #FFFFFF;
      /* White text color */
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .rounded-button:hover {
      background-color: #0056A7;
      /* Darker blue color on hover */
    }

    .seed-text {
      color: #FFFFFF;
      /* White text color */
      font-size: 18px;
      margin-bottom: 10px;
      /* Add some bottom margin */
      text-align: center;
      position: absolute;
      left: 1rem;
      top: 1rem;
      text-align: left;
    }

    .download {
      position: absolute;
      left: 1rem;
      bottom: 1rem;
    }

    .pattern-background {
      position: relative;
      overflow: hidden;
      background-color: #001F3F;
    }

    .pattern-background::before {
      content: "";
      position: absolute;
      inset: -100%;
      transform: rotate(0deg);
      transform-origin: center;
      background-color: #001F3F;
      opacity: 0.2;
      background-image: 
        linear-gradient(30deg, #444CF7 12%, transparent 12.5%, transparent 87%, #444CF7 87.5%, #444CF7), 
        linear-gradient(150deg, #444CF7 12%, transparent 12.5%, transparent 87%, #444CF7 87.5%, #444CF7), 
        linear-gradient(30deg, #444CF7 12%, transparent 12.5%, transparent 87%, #444CF7 87.5%, #444CF7), 
        linear-gradient(150deg, #444CF7 12%, transparent 12.5%, transparent 87%, #444CF7 87.5%, #444CF7), 
        linear-gradient(60deg, #444CF777 25%, transparent 25.5%, transparent 75%, #444CF777 75%, #444CF777), 
        linear-gradient(60deg, #444CF777 25%, transparent 25.5%, transparent 75%, #444CF777 75%, #444CF777);
      background-size: 80px 140px;
      background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;
    }
  </style>
  <title>{{world.name}}</title>
</head>

<body class="pattern-background">
  <div class="seed-text">
    {{world.name}} - {{date.map}}
    <br>
    Seed: {{world.seed}}
    <br>
  </div>

  <div class="button-container">
    <a href="/maps/overworld">
      <button class="rounded-button">Overworld</button>
    </a>
    <a href="/maps/nether">
      <button class="rounded-button">Nether</button>
    </a>
    <a href="/maps/end">
      <button class="rounded-button">The End</button>
    </a>
  </div>

  <div class="download button-container">
    Last archived on {{date.download}}.

    <a href="FlatEarth-Bedrock.mcworld" target="_blank">
      <button class="rounded-button">Download (Bedrock)</button>
    </a>
    <a href="FlatEarth-Java.zip" target="_blank">
      <button class="rounded-button">Download (Java)</button>
    </a>
  </div>
</body>

</html>
